protocols = imap
listen = 127.0.0.1
ssl = required
auth_allow_cleartext = no
auth_mechanisms = plain login
default_internal_user = vmail
default_internal_group = vmail
default_login_user = vmail

# Use the official image's documented unprivileged users, ports and no-chroot login mode.
service imap-login {
  chroot =
  inet_listener imap {
    port = 31143
  }
  inet_listener imaps {
    port = 31993
    ssl = yes
  }
}

namespace inbox {
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
}
