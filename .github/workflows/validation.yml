name: OSS validation

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    oss:
        name: OSS build and regressions
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Set up Node.js for the source build
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: '22'
                  package-manager-cache: false

            - name: Set up pnpm from packageManager
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  run_install: false

            - name: Install locked dependencies
              run: pnpm install --frozen-lockfile

            - name: Build OSS
              run: pnpm build:oss

            - name: Run synthetic policy regressions
              run: pnpm test:oss

            - name: Check frontend types
              run: pnpm --filter @open-archiver/frontend check

            - name: Run isolated production frontend regressions
              run: |
                  docker build --tag openarchiver-frontend-test packages/frontend/tests
                  docker run --rm --network none --read-only --tmpfs /tmp \
                    --mount "type=bind,source=$GITHUB_WORKSPACE,target=/app,readonly" \
                    openarchiver-frontend-test

    renovate:
        name: Renovate configuration
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Set up Node.js for Renovate
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: '24'
                  package-manager-cache: false

            - name: Validate Renovate configuration
              run: npx --yes --package=renovate@44.149.2 renovate-config-validator --strict renovate.json
